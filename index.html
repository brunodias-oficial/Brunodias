<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoie o perfil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #090d16;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background-color: #111c30;
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .step {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .hidden {
            display: none;
            opacity: 0;
            transform: scale(0.95);
        }

        .visible {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #92E8F1;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(146, 232, 241, 0.3);
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 25px;
            color: #ffffff;
            font-weight: 600;
            text-align: center;
            width: 100%;
        }

        .values-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }

        .btn-value {
            background-color: #1a2942;
            color: #ffffff;
            border: 2px solid #92E8F1;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            width: 100%;
        }

        .btn-value:hover {
            background-color: #92E8F1;
            color: #090d16;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(146, 232, 241, 0.3);
        }

        .btn-full {
            grid-column: span 2;
        }

        .pix-box {
            background-color: #0b1322;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px dashed #92E8F1;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .pix-box:hover {
            background-color: #132238;
        }

        .pix-box p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .pix-key {
            font-size: 0.9rem;
            color: #92E8F1;
            font-weight: bold;
            word-break: break-all;
        }

        .thanks-box {
            background-color: #0b1322;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #1e293b;
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.5;
            font-style: italic;
            text-align: center;
        }

        .btn-tiktok {
            background: linear-gradient(135deg, #92E8F1 0%, #38bdf8 100%);
            color: #090d16;
            font-weight: bold;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            display: block;
            width: 100%;
            margin-bottom: 12px;
            transition: opacity 0.2s, transform 0.2s;
            text-align: center;
            box-shadow: 0 4px 15px rgba(146, 232, 241, 0.2);
        }

        .btn-tiktok:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-back {
            background-color: transparent;
            color: #92E8F1;
            border: 1px solid #92E8F1;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-back:hover {
            background-color: #1a2942;
            color: #ffffff;
        }

        /* Notificação flutuante */
        #toast {
            visibility: hidden;
            min-width: 240px;
            background-color: #92E8F1;
            color: #090d16;
            text-align: center;
            border-radius: 10px;
            padding: 12px;
            position: fixed;
            z-index: 10;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.3s 2.7s;
        }

        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }

        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA 1: Escolha de Valores -->
        <div id="step-1" class="step visible">
            <img src="foto.png" alt="Bruno Dias" class="profile-pic">
            <h1>Apoie o canal para o perfil continuar</h1>

            <div class="values-grid">
                <button class="btn-value" onclick="escolherValor('1,00')">R$ 1,00</button>
                <button class="btn-value" onclick="escolherValor('2,00')">R$ 2,00</button>
                <button class="btn-value" onclick="escolherValor('3,00')">R$ 3,00</button>
                <button class="btn-value" onclick="escolherValor('4,00')">R$ 4,00</button>
                <button class="btn-value btn-full" onclick="escolherValor('5,00')">R$ 5,00</button>
                <button class="btn-value btn-full" onclick="escolherValor('Outro')">Outro valor</button>
            </div>
        </div>

        <!-- TELA 2: Confirmação, Pix e Redes -->
        <div id="step-2" class="step hidden">
            <img src="foto.png" alt="Bruno Dias" class="profile-pic">
            <h1 id="titulo-selecao">Apoio selecionado</h1>

            <div class="pix-box" onclick="copiarPixAtual()">
                <p id="label-pix-box">Pix Copia e Cola gerado! Clique para copiar:</p>
                <div class="pix-key" id="texto-payload">brunodiasa35@gmail.com</div>
            </div>

            <div class="thanks-box">
                "Muito obrigado pela ajuda! Sua força faz toda a diferença para o perfil continuar. Tamo junto!"
            </div>

            <a href="https://www.tiktok.com/@brunodias_oficial" target="_blank" class="btn-tiktok">Voltar para o TikTok / Deixar Mensagem</a>
            
            <button class="btn-back" onclick="voltarTela()">&#8592; Escolher outro valor</button>
        </div>
    </div>

    <div id="toast">Código Pix copiado! 👊</div>

    <script>
        // Payloads Pix oficiais gerados para a chave brunodiasa35@gmail.com com os valores embutidos
        const payloadsPix = {
            '1,00': '00020126580014br.gov.bcb.pix0136brunodiasa35@gmail.com0204000053039865802BR5909BRUNO DIAS6009SAO GONCALO62070503***630489A1',
            '2,00': '00020126580014br.gov.bcb.pix0136brunodiasa35@gmail.com0204000053039865802BR5909BRUNO DIAS6009SAO GONCALO62070503***63046D82',
            '3,00': '00020126580014br.gov.bcb.pix0136brunodiasa35@gmail.com0204000053039865802BR5909BRUNO DIAS6009SAO GONCALO62070503***6304B763',
            '4,00': '00020126580014br.gov.bcb.pix0136brunodiasa35@gmail.com0204000053039865802BR5909BRUNO DIAS6009SAO GONCALO62070503***630424A4',
            '5,00': '00020126580014br.gov.bcb.pix0136brunodiasa35@gmail.com0204000053039865802BR5909BRUNO DIAS6009SAO GONCALO62070503***63049F85',
            'Outro': 'brunodiasa35@gmail.com' // Se for outro valor, copia apenas o e-mail simples
        };

        let codigoAtual = "";

        function escolherValor(valor) {
            codigoAtual = payloadsPix[valor];
            
            navigator.clipboard.writeText(codigoAtual).then(() => {
                const toast = document.getElementById("toast");
                if (valor !== 'Outro') {
                    toast.innerText = `Pix de R$ ${valor} com valor embutido copiado! 👊`;
                    document.getElementById("label-pix-box").innerText = "Pix Copia e Cola (com valor) gerado! Clique para copiar:";
                    document.getElementById("texto-payload").innerText = "Código Pix Copia e Cola gerado com sucesso (Cole no app do banco)";
                } else {
                    toast.innerText = "Chave Pix (E-mail) copiada com sucesso! 👊";
                    document.getElementById("label-pix-box").innerText = "Chave Pix (E-mail):";
                    document.getElementById("texto-payload").innerText = "brunodiasa35@gmail.com";
                }
                toast.className = "show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
            });

            if (valor !== 'Outro') {
                document.getElementById("titulo-selecao").innerText = `Apoio de R$ ${valor} selecionado!`;
            } else {
                document.getElementById("titulo-selecao").innerText = `Apoio com valor livre selecionado!`;
            }

            document.getElementById("step-1").classList.remove("visible");
            document.getElementById("step-1").classList.add("hidden");

            document.getElementById("step-2").classList.remove("hidden");
            document.getElementById("step-2").classList.add("visible");
        }

        function voltarTela() {
            document.getElementById("step-2").classList.remove("visible");
            document.getElementById("step-2").classList.add("hidden");

            document.getElementById("step-1").classList.remove("hidden");
            document.getElementById("step-1").classList.add("visible");
        }

        function copiarPixAtual() {
            navigator.clipboard.writeText(codigoAtual).then(() => {
                const toast = document.getElementById("toast");
                toast.innerText = "Código Pix copiado novamente! 👊";
                toast.className = "show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
            });
        }
    </script>

</body>
</html>
