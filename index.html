<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoie o perfil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            width: 100%;
            max-width: 420px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid #334155;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 25px;
            color: #f1f5f9;
            font-weight: 600;
        }

        .values-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-value {
            background-color: #334155;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: block;
        }

        .btn-value:hover {
            background-color: #38bdf8;
            color: #0f172a;
            transform: translateY(-2px);
        }

        .btn-full {
            grid-column: span 2;
        }

        .pix-box {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px dashed #38bdf8;
        }

        .pix-box p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .pix-key {
            font-size: 0.95rem;
            color: #38bdf8;
            font-weight: bold;
            word-break: break-all;
        }

        .social-section {
            margin-top: 20px;
            border-top: 1px solid #334155;
            padding-top: 20px;
        }

        .btn-tiktok {
            background-color: #00f2fe;
            background-image: linear-gradient(45deg, #00f2fe 0%, #4facfe 100%);
            color: #0f172a;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            display: block;
            transition: opacity 0.2s;
        }

        .btn-tiktok:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Substitua o link abaixo pela URL da sua foto -->
        <img src="https://via.placeholder.com/100" alt="Bruno Dias" class="profile-pic">
        
        <h1>Apoie o canal para o perfil continuar</h1>

        <div class="values-grid">
            <button class="btn-value">R$ 1,00</button>
            <button class="btn-value">R$ 2,00</button>
            <button class="btn-value">R$ 3,00</button>
            <button class="btn-value">R$ 4,00</button>
            <button class="btn-value btn-full">R$ 5,00</button>
            <button class="btn-value btn-full">Outro valor</button>
        </div>

        <div class="pix-box">
            <p>Chave Pix (E-mail):</p>
            <div class="pix-key">brunodiasa35@gmail.com</div>
        </div>

        <div class="social-section">
            <a href="https://www.tiktok.com/@brunodias_oficial" target="_blank" class="btn-tiktok">TikTok: @brunodias_oficial</a>
        </div>
    </div>

</body>
</html>
