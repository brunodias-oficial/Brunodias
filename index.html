<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoie o perfil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #090d16;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background-color: #111c30;
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid #1e293b;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .step {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            top: 35px;
            left: 25px;
            right: 25px;
            width: calc(100% - 50px);
        }

        .hidden {
            opacity: 0;
            transform: scale(0.95) translateY(15px);
            pointer-events: none;
            position: absolute;
        }

        .visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            position: relative;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00f2fe;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 25px;
            color: #ffffff;
            font-weight: 600;
            text-align: center;
            width: 100%;
        }

        .values-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-value {
            background-color: #1a2942;
            color: #ffffff;
            border: 2px solid #2563eb;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            width: 100%;
        }

        .btn-value:hover {
            background-color: #2563eb;
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-full {
            grid-column: span 2;
        }

        .pix-box {
            background-color: #0b1322;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px dashed #00f2fe;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .pix-box:hover {
            background-color: #132238;
        }

        .pix-box p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .pix-key {
            font-size: 1rem;
            color: #00f2fe;
            font-weight: bold;
            word-break: break-all;
        }

        .thanks-box {
            background-color: #0b1322;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #1e293b;
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.5;
            font-style: italic;
            text-align: center;
        }

        .btn-tiktok {
            background: linear-gradient(135deg, #00f2fe 0%, #2563eb 100%);
            color: #ffffff;
            font-weight: bold;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            display: block;
            width: 100%;
            margin-bottom: 12px;
            transition: opacity 0.2s, transform 0.2s;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }

        .btn-tiktok:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-back {
            background-color: transparent;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 12px;
            font-size: 0.95rem;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-back:hover {
            background-color: #1a2942;
            color: #ffffff;
            border-color: #64748b;
        }

        /* Notificação flutuante */
        #toast {
            visibility: hidden;
            min-width: 220px;
            background-color: #00f2fe;
            color: #0b1322;
            text-align: center;
            border-radius: 10px;
            padding: 12px;
            position: fixed;
            z-index: 10;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.3s 2.7s;
        }

        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }

        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA 1: Escolha de Valores -->
        <div id="step-1" class="step visible">
            <img src="foto.png" alt="Bruno Dias" class="profile-pic">
            <h1>Apoie o canal para o perfil continuar</h1>

            <div class="values-grid">
                <button class="btn-value" onclick="escolherValor('1,00')">R$ 1,00</button>
                <button class="btn-value" onclick="escolherValor('2,00')">R$ 2,00</button>
                <button class="btn-value" onclick="escolherValor('3,00')">R$ 3,00</button>
                <button class="btn-value" onclick="escolherValor('4,00')">R$ 4,00</button>
                <button class="btn-value btn-full" onclick="escolherValor('5,00')">R$ 5,00</button>
                <button class="btn-value btn-full" onclick="escolherValor('Outro')">Outro valor</button>
            </div>
        </div>

        <!-- TELA 2: Confirmação, Pix e Redes -->
        <div id="step-2" class="step hidden">
            <img src="foto.png" alt="Bruno Dias" class="profile-pic">
            <h1 id="titulo-selecao">Apoio selecionado</h1>

            <div class="pix-box" onclick="copiarPixDireto()">
                <p>Chave Pix copiada! Clique para copiar novamente:</p>
                <div class="pix-key">brunodiasa35@gmail.com</div>
            </div>

            <div class="thanks-box">
                "Muito obrigado pela ajuda! Sua força faz toda a diferença para o perfil continuar. Tamo junto!"
            </div>

            <a href="https://www.tiktok.com/@brunodias_oficial" target="_blank" class="btn-tiktok">Voltar para o TikTok / Deixar Mensagem</a>
            
            <button class="btn-back" onclick="voltarTela()">Escolher outro valor</button>
        </div>
    </div>

    <div id="toast">Chave Pix copiada! 👊</div>

    <script>
        function escolherValor(valor) {
            const chave = "brunodiasa35@gmail.com";
            navigator.clipboard.writeText(chave).then(() => {
                const toast = document.getElementById("toast");
                toast.innerText = `Pix de R$ ${valor} copiado com sucesso! 👊`;
                toast.className = "show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
            });

            document.getElementById("titulo-selecao").innerText = `Apoio de R$ ${valor} selecionado!`;

            document.getElementById("step-1").classList.remove("visible");
            document.getElementById("step-1").classList.add("hidden");

            document.getElementById("step-2").classList.remove("hidden");
            document.getElementById("step-2").classList.add("visible");
        }

        function voltarTela() {
            document.getElementById("step-2").classList.remove("visible");
            document.getElementById("step-2").classList.add("hidden");

            document.getElementById("step-1").classList.remove("hidden");
            document.getElementById("step-1").classList.add("visible");
        }

        function copiarPixDireto() {
            const chave = "brunodiasa35@gmail.com";
            navigator.clipboard.writeText(chave).then(() => {
                const toast = document.getElementById("toast");
                toast.innerText = "Chave Pix copiada novamente! 👊";
                toast.className = "show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
            });
        }
    </script>

</body>
</html>
