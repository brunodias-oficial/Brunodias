<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa Online - R$ 5,00</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --success-color: #10b981;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
            color: var(--primary-color);
            font-size: 24px;
            cursor: pointer; /* Mostra que é interativo discretamente */
            user-select: none;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: #059669;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 15px;
            font-size: 14px;
            color: #4b5563;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .number-btn {
            background-color: #e5e7eb;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .number-btn.selected {
            background-color: var(--primary-color);
            color: white;
        }

        .number-btn.sold {
            background-color: #ef4444;
            color: white;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .submit-btn {
            background-color: var(--success-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #059669;
        }

        /* Painel Oculto por padrão */
        .admin-panel {
            display: none;
            margin-top: 25px;
            border-top: 1px solid #e5e7eb;
            padding-top: 15px;
            text-align: left;
            background-color: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
        }

        .admin-panel ul {
            padding-left: 15px;
            margin: 5px 0;
            max-height: 150px;
            overflow-y: auto;
        }

        .reset-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dê 3 cliques rápidos neste título para abrir o painel -->
        <h1 id="mainTitle">Rifa Solidária</h1>
        <div class="price">Valor: R$ 5,00 por número</div>
        <p>Clique em um número disponível, digite seu nome e confirme!</p>

        <!-- Grade de Números -->
        <div class="grid" id="numberGrid"></div>

        <!-- Formulário -->
        <div id="formContainer" style="display: none;">
            <div class="form-group">
                <label for="buyerName">Nome Completo para o Número <span id="selectedNumberDisplay"></span>:</label>
                <input type="text" id="buyerName" placeholder="Digite seu nome e sobrenome">
            </div>
            <button class="submit-btn" onclick="confirmPurchase()">Confirmar Escolha</button>
        </div>

        <!-- Painel do Organizador Oculto -->
        <div class="admin-panel" id="adminPanel">
            <strong>🔐 Painel Secreto do Organizador:</strong>
            <ul id="buyersList">
                <li>Nenhum número vendido ainda.</li>
            </ul>
            <button class="reset-btn" onclick="resetRaffle()">Zerar Rifa</button>
        </div>
    </div>

    <script>
        let rifaData = JSON.parse(localStorage.getItem('rifaData')) || {};
        let selectedNumber = null;

        const grid = document.getElementById('numberGrid');
        const formContainer = document.getElementById('formContainer');
        const selectedNumberDisplay = document.getElementById('selectedNumberDisplay');
        const buyerNameInput = document.getElementById('buyerName');
        const buyersList = document.getElementById('buyersList');
        const adminPanel = document.getElementById('adminPanel');
        const mainTitle = document.getElementById('mainTitle');

        function renderGrid() {
            grid.innerHTML = '';
            for (let i = 1; i <= 20; i++) {
                const btn = document.createElement('button');
                btn.className = 'number-btn';
                btn.innerText = i;

                if (rifaData[i]) {
                    btn.classList.add('sold');
                    btn.title = `Vendido para: ${rifaData[i]}`;
                    btn.disabled = true;
                } else {
                    btn.onclick = () => selectNumber(i, btn);
                    if (selectedNumber === i) {
                        btn.classList.add('selected');
                    }
                }
                grid.appendChild(btn);
            }
            updateAdminList();
        }

        function selectNumber(num, btnElement) {
            document.querySelectorAll('.number-btn').forEach(b => {
                if (!b.classList.contains('sold')) {
                    b.classList.remove('selected');
                }
            });

            selectedNumber = num;
            btnElement.classList.add('selected');
            selectedNumberDisplay.innerText = `#${num}`;
            formContainer.style.display = 'block';
            buyerNameInput.focus();
        }

        function confirmPurchase() {
            const name = buyerNameInput.value.trim();
            if (!name) {
                alert('Por favor, digite seu nome.');
                return;
            }

            if (selectedNumber && !rifaData[selectedNumber]) {
                rifaData[selectedNumber] = name;
                localStorage.setItem('rifaData', JSON.stringify(rifaData));

                alert(`Número ${selectedNumber} reservado com sucesso para ${name}!`);
                
                selectedNumber = null;
                buyerNameInput.value = '';
                formContainer.style.display = 'none';
                renderGrid();
            }
        }

        function updateAdminList() {
            buyersList.innerHTML = '';
            const keys = Object.keys(rifaData);
            
            if (keys.length === 0) {
                buyersList.innerHTML = '<li>Nenhum número vendido ainda.</li>';
                return;
            }

            keys.sort((a, b) => a - b).forEach(num => {
                const li = document.createElement('li');
                li.innerText = `Número ${num}: ${rifaData[num]}`;
                buyersList.appendChild(li);
            });
        }

        function resetRaffle() {
            if (confirm('Tem certeza que deseja apagar todos os dados da rifa?')) {
                rifaData = {};
                localStorage.removeItem('rifaData');
                selectedNumber = null;
                formContainer.style.display = 'none';
                renderGrid();
                adminPanel.style.display = 'none';
            }
        }

        // Atalho por clique triplo no título (funciona perfeitamente no celular e PC)
        mainTitle.addEventListener('click', function(event) {
            // Verifica se deu 3 cliques rápidos
            if (event.detail === 3) {
                const senha = prompt('Digite a senha de administrador:');
                if (senha === '1234') { // Senha padrão
                    adminPanel.style.display = adminPanel.style.display === 'block' ? 'none' : 'block';
                } else if (senha !== null) {
                    alert('Senha incorreta.');
                }
            }
        });

        renderGrid();
    </script>
</body>
</html>
