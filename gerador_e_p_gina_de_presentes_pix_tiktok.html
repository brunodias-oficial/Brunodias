<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Página de Presentes Pix - TikTok / Linktree</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- QRCode.js Library for rendering live QR codes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-subtle': 'bounceSubtle 2s ease-in-out infinite',
          },
          keyframes: {
            bounceSubtle: {
              '0%, 100%': { transform: 'translateY(-2%)' },
              '50%': { transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }

    .preset-card { transition: all 0.2s ease-in-out; }
    .preset-card:hover { transform: translateY(-2px); }
  </style>
</head>

<body class="h-full font-sans antialiased bg-slate-950 text-slate-100 flex flex-col md:flex-row overflow-x-hidden">

  <!-- SIDEBAR: EDITOR DE CONFIGURAÇÕES -->
  <aside id="editor-sidebar" class="w-full md:w-[450px] lg:w-[480px] bg-slate-900/90 border-r border-slate-800 flex flex-col h-auto md:h-screen z-20 shrink-0">
    
    <!-- Sidebar Header -->
    <div class="p-5 border-b border-slate-800/80 flex items-center justify-between bg-slate-900/50 backdrop-blur">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 via-red-500 to-cyan-400 p-0.5 shadow-lg shadow-pink-500/20">
          <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
            <i class="fa-solid fa-wand-magic-sparkles text-pink-500 text-lg"></i>
          </div>
        </div>
        <div>
          <h1 class="font-display font-bold text-lg text-white leading-tight">Criador de Página Pix</h1>
          <p class="text-xs text-slate-400">Personalize fotos, cores, layouts e QR Codes</p>
        </div>
      </div>
      
      <button id="toggle-sidebar-mobile" onclick="toggleSidebarMobile()" class="md:hidden p-2 text-slate-400 hover:text-white rounded-lg bg-slate-800/50">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>
    </div>

    <!-- Controls Form Container -->
    <div id="controls-body" class="flex-1 overflow-y-auto p-5 space-y-6">

      <!-- PRESETS RÁPIDOS -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">
          <i class="fa-solid fa-palette text-pink-400 mr-1.5"></i> Temas Pré-definidos
        </label>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="applyPreset('tiktok')" class="preset-card p-2.5 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-800 text-left flex flex-col items-center">
            <div class="flex space-x-1 mb-1.5">
              <span class="w-3 h-3 rounded-full bg-black border border-slate-600"></span>
              <span class="w-3 h-3 rounded-full bg-[#ff0050]"></span>
              <span class="w-3 h-3 rounded-full bg-[#00f2ea]"></span>
            </div>
            <span class="text-xs font-medium text-slate-200">TikTok Dark</span>
          </button>

          <button onclick="applyPreset('roseGold')" class="preset-card p-2.5 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-800 text-left flex flex-col items-center">
            <div class="flex space-x-1 mb-1.5">
              <span class="w-3 h-3 rounded-full bg-[#2b1820]"></span>
              <span class="w-3 h-3 rounded-full bg-[#f472b6]"></span>
              <span class="w-3 h-3 rounded-full bg-[#fb7185]"></span>
            </div>
            <span class="text-xs font-medium text-slate-200">Rose Gold</span>
          </button>

          <button onclick="applyPreset('cyberpunk')" class="preset-card p-2.5 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-800 text-left flex flex-col items-center">
            <div class="flex space-x-1 mb-1.5">
              <span class="w-3 h-3 rounded-full bg-black"></span>
              <span class="w-3 h-3 rounded-full bg-[#facc15]"></span>
              <span class="w-3 h-3 rounded-full bg-[#22d3ee]"></span>
            </div>
            <span class="text-xs font-medium text-slate-200">Cyberpunk</span>
          </button>

          <button onclick="applyPreset('cleanLight')" class="preset-card p-2.5 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-800 text-left flex flex-col items-center">
            <div class="flex space-x-1 mb-1.5">
              <span class="w-3 h-3 rounded-full bg-[#f8fafc]"></span>
              <span class="w-3 h-3 rounded-full bg-[#4f46e5]"></span>
              <span class="w-3 h-3 rounded-full bg-[#ec4899]"></span>
            </div>
            <span class="text-xs font-medium text-slate-200">Claro Lofi</span>
          </button>

          <button onclick="applyPreset('emerald')" class="preset-card p-2.5 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-800 text-left flex flex-col items-center">
            <div class="flex space-x-1 mb-1.5">
              <span class="w-3 h-3 rounded-full bg-[#022c22]"></span>
              <span class="w-3 h-3 rounded-full bg-[#10b981]"></span>
              <span class="w-3 h-3 rounded-full bg-[#fbbf24]"></span>
            </div>
            <span class="text-xs font-medium text-slate-200">Emerald Lux</span>
          </button>

          <button onclick="applyPreset('purpleVibe')" class="preset-card p-2.5 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-800 text-left flex flex-col items-center">
            <div class="flex space-x-1 mb-1.5">
              <span class="w-3 h-3 rounded-full bg-[#0f051d]"></span>
              <span class="w-3 h-3 rounded-full bg-[#a855f7]"></span>
              <span class="w-3 h-3 rounded-full bg-[#38bdf8]"></span>
            </div>
            <span class="text-xs font-medium text-slate-200">Roxinho Lofi</span>
          </button>
        </div>
      </div>

      <!-- PERFIL E FOTO -->
      <div class="space-y-4 pt-3 border-t border-slate-800">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">
          <i class="fa-solid fa-camera-retro text-cyan-400 mr-1.5"></i> Perfil & Sua Foto
        </label>

        <!-- Image Upload Toggle -->
        <div>
          <label class="block text-xs text-slate-300 mb-1 font-medium">Foto de Perfil</label>
          <div class="flex gap-2 mb-2">
            <button type="button" onclick="setPhotoTab('file')" id="tab-btn-file" class="flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold border border-pink-500 bg-pink-500/10 text-pink-400">
              <i class="fa-solid fa-upload mr-1"></i> Enviar do Seu Celular/PC
            </button>
            <button type="button" onclick="setPhotoTab('url')" id="tab-btn-url" class="flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold border border-slate-800 bg-slate-950 text-slate-400">
              <i class="fa-solid fa-link mr-1"></i> Usar Link (URL)
            </button>
          </div>

          <!-- Upload Local File Input -->
          <div id="photo-input-file-container" class="space-y-2">
            <div class="flex items-center justify-center w-full">
              <label for="input-avatar-file" class="flex flex-col items-center justify-center w-full h-24 border-2 border-slate-700 border-dashed rounded-xl cursor-pointer bg-slate-950 hover:bg-slate-900 hover:border-pink-500 transition">
                <div class="flex flex-col items-center justify-center pt-3 pb-3">
                  <i class="fa-solid fa-cloud-arrow-up text-pink-500 text-2xl mb-1"></i>
                  <p class="text-xs text-slate-300"><span class="font-semibold">Clique para escolher foto</span> do seu dispositivo</p>
                  <p class="text-[10px] text-slate-500 mt-0.5">PNG, JPG, JPEG ou WEBP</p>
                </div>
                <input id="input-avatar-file" type="file" accept="image/*" class="hidden" onchange="handleFileUpload(event)" />
              </label>
            </div>
            <p class="text-[11px] text-amber-400/90 flex items-center gap-1.5 bg-amber-500/10 p-2 rounded-lg border border-amber-500/20">
              <i class="fa-solid fa-circle-info shrink-0"></i>
              <span>O preview mostrará sua foto enviada. Para publicação final no GitHub, explicaremos como salvar como <b>foto.jpg</b>.</span>
            </p>
          </div>

          <!-- URL Input Container -->
          <div id="photo-
