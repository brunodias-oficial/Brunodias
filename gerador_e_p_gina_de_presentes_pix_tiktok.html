<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Me envie um Mimo! 🎁</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0d0e15;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      margin: 0;
    }

    .profile {
      text-align: center;
      margin-bottom: 20px;
    }

    .profile h2 {
      margin-bottom: 5px;
    }

    .profile p {
      color: #aaaaaa;
      font-size: 14px;
      margin-top: 0;
    }

    .card {
      background-color: #181a24;
      border: 1px solid #2a2d3d;
      border-radius: 16px;
      padding: 18px;
      margin: 10px 0;
      width: 100%;
      max-width: 350px;
      text-align: center;
    }

    .card h3 {
      margin: 0 0 6px 0;
      color: #fe2c55;
    }

    .card p {
      margin: 0 0 14px 0;
      font-size: 13px;
      color: #cccccc;
    }

    .btn {
      background-color: #25d366;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="profile">
    <h2>Me envie um Mimo! 🎁</h2>
    <p>Escolha um presente abaixo e faça um Pix:</p>
  </div>

  <div class="card">
    <h3>☕ Um Café - R$ 5,00</h3>
    <p>Ajude a manter a energia para gravar os vídeos!</p>
    <button class="btn" onclick="presentear('36064ea4-258f-4328-a099-2bff7f4035dd', 'Um Café')">🎁 Presentear</button>
  </div>

  <div class="card">
    <h3>🍕 Uma Pizza - R$ 30,00</h3>
    <p>Pague o lanche do criador de conteúdo!</p>
    <button class="btn" onclick="presentear('36064ea4-258f-4328-a099-2bff7f4035dd', 'Uma Pizza')">🎁 Presentear</button>
  </div>

  <div class="card">
    <h3>🚀 Apoiar o Canal - Qualquer Valor</h3>
    <p>Sua ajuda faz toda a diferença para o canal crescer.</p>
    <button class="btn" onclick="presentear('36064ea4-258f-4328-a099-2bff7f4035dd', 'Apoio ao Canal')">🎁 Presentear</button>
  </div>

  <script>
    function presentear(chave, presente) {
      navigator.clipboard.writeText(chave);
      alert('🎁 Chave Pix do presente "' + presente + '" copiada!\n\nAgora abra o aplicativo do seu banco e use a opção Pix para colar a chave.');
    }
  </script>

</body>
</html>
